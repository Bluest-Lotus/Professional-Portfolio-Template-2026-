---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="card-meta">
    {{ page.date | date: "%B %d, %Y" }}
    {% if page.tags %}
      ·
      {% for tag in page.tags %}
        <a href="/tags/#{{ tag }}"><span class="tag">{{ tag }}</span></a>
      {% endfor %}
    {% endif %}
  </p>

  {{ content }}
</article>
