---
layout: default
---

<h1>{{ page.title }}</h1>

{% if page.thumbnail %}
<img src="{{ page.thumbnail }}" alt="{{ page.title }}" style="width:100%;border-radius:8px;">
{% endif %}

<p><strong>Tags:</strong>
{% for tag in page.tags %}
  <a href="/tags/#{{ tag }}"><span class="tag">{{ tag }}</span></a>
{% endfor %}
</p>

{{ content }}
