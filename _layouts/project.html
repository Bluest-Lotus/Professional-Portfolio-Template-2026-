---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  {% if page.thumbnail %}
  <img src="{{ page.thumbnail }}" alt="{{ page.title }}" class="card-thumb" style="max-height:260px;">
  {% endif %}

  <p class="card-meta">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <a href="/tags/#{{ tag }}"><span class="tag">{{ tag }}</span></a>
    {% endfor %}
  </p>

  {{ content }}
</article>
