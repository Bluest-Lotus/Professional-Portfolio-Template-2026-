<!DOCTYPE html>
<html>
<head>
  <title>Projects — Your Name</title>

  <link rel="stylesheet" href="/Professional-Portfolio-Template-2026-/assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/Professional-Portfolio-Template-2026-/assets/script.js" defer></script>
</head>
<body>

<span class="toggle" onclick="toggleDark()">🌓</span>

<header>
  <h2>Your Name</h2>
  <nav>
    <a href="/Professional-Portfolio-Template-2026-/index.html">Home</a>
    <a href="/Professional-Portfolio-Template-2026-/projects/index.html">Projects</a>
    <a href="/Professional-Portfolio-Template-2026-/blog/index.html">Blog</a>
    <a href="/Professional-Portfolio-Template-2026-/about.html">About</a>
  </nav>
</header>

<div class="container">
  <h1>Projects</h1>

  <h3>Browse by tag:</h3>
  <div id="tag-bar" style="margin-bottom: 20px;"></div>

  <div class="grid" id="projects-grid"></div>
</div>

<footer>
  © 2025 Your Name • 
  <a href="https://www.linkedin.com/in/yourprofile" target="_blank">LinkedIn</a> •
  <a href="/Professional-Portfolio-Template-2026-/assets/resume.pdf" target="_blank">Resume</a>
</footer>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    await loadIndex("projects", "#projects-grid");

    // Build tag bar dynamically
    const tags = new Set();
    document.querySelectorAll(".item").forEach(item => {
      item.dataset.tags.split(",").forEach(t => tags.add(t.trim()));
    });

    const bar = document.getElementById("tag-bar");
    tags.forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = tag;
      span.onclick = () => filterByTag(tag);
      bar.appendChild(span);
    });
  });
</script>

</body>
</html>
